name: Build APK from ZIP

on:
  workflow_dispatch:

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Unzip source bundle
        run: unzip -o body_tracker_professional_v4_online_ready.zip -d src

      - name: Show extracted structure
        run: |
          echo "=== SRC ==="
          ls -la src
          echo "=== BODYV2 ==="
          ls -la src/bodyv2

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.7"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Build debug APK
        working-directory: src/bodyv2
        run: gradle assembleDebug --stacktrace --info --no-daemon

      - name: Find APK
        run: find src/bodyv2 -path "*/app/build/outputs/apk/debug/*.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: body-tracker-debug-apk
          path: src/bodyv2/app/build/outputs/apk/debug/*.apk
