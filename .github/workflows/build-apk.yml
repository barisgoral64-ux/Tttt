name: Build APK from ZIP

on:
  workflow_dispatch:

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Unzip source bundle
        run: unzip -o body_tracker_professional_v4_online_ready.zip -d src

      - name: Show extracted files
        run: |
          echo "SRC ICERIGI:"
          ls -la src
          echo "ALT KLASORLER:"
          find src -maxdepth 2 -type f | head -100

      - name: Find project dir
        id: find_project
        run: |
          PROJECT_DIR=$(find src -name gradlew -type f | head -1 | xargs dirname)
          echo "project_dir=$PROJECT_DIR" >> $GITHUB_OUTPUT
          echo "Bulunan klasor: $PROJECT_DIR"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.7"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install Android packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Make gradlew executable
        working-directory: ${{ steps.find_project.outputs.project_dir }}
        run: chmod +x ./gradlew

      - name: Build debug APK
        working-directory: ${{ steps.find_project.outputs.project_dir }}
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: body-tracker-debug-apk
          path: ${{ steps.find_project.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk
