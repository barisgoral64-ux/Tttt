name: Build Signed Release APK from ZIP

on:
  workflow_dispatch:

jobs:
  build-release-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Unzip source bundle
        run: unzip -o body_tracker_professional_v20_notifications_update_fix.zip -d src

      - name: Show extracted structure
        run: |
          echo "=== TOP LEVEL ==="
          find src -maxdepth 3 | sed -n '1,200p'

      - name: Find Android project directory
        id: find_project
        run: |
          PROJECT_DIR=$(find src -type f \( -name "settings.gradle.kts" -o -name "settings.gradle" \) | head -1 | xargs dirname)
          if [ -z "$PROJECT_DIR" ]; then
            echo "Android project directory not found"
            exit 1
          fi
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Found project dir: $PROJECT_DIR"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.7"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Build signed release APK and capture log
        working-directory: ${{ steps.find_project.outputs.project_dir }}
        run: |
          set -o pipefail
          gradle assembleRelease --stacktrace --info --no-daemon 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: ${{ steps.find_project.outputs.project_dir }}/build.log

      - name: Upload signed release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: forever-danisan-takip-release-apk
          path: ${{ steps.find_project.outputs.project_dir }}/app/build/outputs/apk/release/*.apk
