name: Build Release APK from ZIP

on:
  workflow_dispatch:

jobs:
  build-release-apk:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      ZIP_NAME: body_tracker_professional_v20_analysis_and_category_fix.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show repo files
        run: |
          echo "=== REPOSITORY ROOT ==="
          ls -la

      - name: Verify ZIP exists
        run: |
          if [ ! -f "$ZIP_NAME" ]; then
            echo "ZIP file not found: $ZIP_NAME"
            exit 1
          fi
          echo "ZIP found: $ZIP_NAME"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Unzip source bundle
        run: |
          rm -rf src
          mkdir -p src
          unzip -o "$ZIP_NAME" -d src

      - name: Show extracted structure
        run: |
          echo "=== EXTRACTED FILES ==="
          find src -maxdepth 3 | sed -n '1,200p'

      - name: Find Android project directory
        id: find_project
        run: |
          PROJECT_DIR=$(find src -type f \( -name "settings.gradle.kts" -o -name "settings.gradle" \) | head -n 1 | xargs dirname)
          if [ -z "$PROJECT_DIR" ]; then
            echo "Android project directory not found"
            exit 1
          fi
          echo "Found project dir: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Build release APK and capture log
        working-directory: ${{ steps.find_project.outputs.project_dir }}
        run: |
          set -o pipefail
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleRelease --stacktrace --info --no-daemon 2>&1 | tee build.log
            exit ${PIPESTATUS[0]}
          else
            gradle assembleRelease --stacktrace --info --no-daemon 2>&1 | tee build.log
            exit ${PIPESTATUS[0]}
          fi

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: ${{ steps.find_project.outputs.project_dir }}/build.log
          if-no-files-found: warn

      - name: Upload release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: forever-danisan-takip-release-apk
          path: |
            ${{ steps.find_project.outputs.project_dir }}/app/build/outputs/apk/release/*.apk
            ${{ steps.find_project.outputs.project_dir }}/**/build/outputs/apk/release/*.apk
          if-no-files-found: error
