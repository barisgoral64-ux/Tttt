name: Build Release APK from ZIP

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-release-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Unzip source bundle
        run: unzip -o body_tracker_professional_v20_notifications_update_fix_patched.zip -d src

      - name: Show extracted structure
        run: |
          echo "=== TOP LEVEL ==="
          find src -maxdepth 3 | sed -n '1,200p'

      - name: Build release APK and capture log
        working-directory: src
        run: |
          set -o pipefail
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleRelease --stacktrace --info --no-daemon 2>&1 | tee build.log
            exit ${PIPESTATUS[0]}
          else
            gradle assembleRelease --stacktrace --info --no-daemon 2>&1 | tee build.log
            exit ${PIPESTATUS[0]}
          fi

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: src/build.log

      - name: Upload release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: forever-danisan-takip-release-apk
          path: src/app/build/outputs/apk/release/*.apk
