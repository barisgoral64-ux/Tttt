name: Build APK from ZIP

on:
  workflow_dispatch:

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Unzip source bundle
        run: unzip -o body_tracker_professional_v4_online_ready.zip -d src

      - name: Show extracted structure
        run: |
          echo "=== SRC ==="
          ls -la src
          echo "=== FIRST 3 LEVELS ==="
          find src -maxdepth 3 | sed -n '1,200p'

      - name: Find gradlew
        id: find_gradlew
        run: |
          GRADLEW_PATH=$(find src -name gradlew -type f | head -1)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "gradlew bulunamadi"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          echo "project_dir=$PROJECT_DIR" >> $GITHUB_OUTPUT
          echo "Bulunan proje klasoru: $PROJECT_DIR"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.7"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Make gradlew executable
        working-directory: ${{ steps.find_gradlew.outputs.project_dir }}
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: ${{ steps.find_gradlew.outputs.project_dir }}
        run: ./gradlew assembleDebug --no-daemon

      - name: Find APK
        run: find src -path "*/app/build/outputs/apk/debug/*.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: body-tracker-debug-apk
          path: src/**/app/build/outputs/apk/debug/*.apk
